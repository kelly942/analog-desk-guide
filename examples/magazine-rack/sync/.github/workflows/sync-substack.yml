# Refreshes covers from Substack once a day and on demand. Commits only if something changed.
# In the repo's Settings > Actions > General, set workflow permissions to "Read and write".
name: Sync Substack
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node sync-substack.mjs
        env:
          SUBSTACK_PUBLICATION: https://YOUR-PUBLICATION.substack.com
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add substack.json covers
          if git diff --cached --quiet; then echo "Nothing changed."; else git commit -m "Sync Substack covers" && git push; fi
